<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <title>Gimnasio Local · Admin</title>
  <meta name="description" content="Administración de gimnasio 100% local, offline-first, sin servidor ni base de datos externa." />

  <!-- ============ PWA ============ -->
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />

  <!-- ============ iOS / iPhone ============ -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gimnasio" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-touch-fullscreen" content="yes" />

  <!-- ============ Estilos ============ -->
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

  <!-- ============ VISTAS ============ -->
  <main id="app">
    <section id="page-dashboard" class="page active"></section>
    <section id="page-clientes"  class="page"></section>
    <section id="page-escanear"  class="page"></section>
    <section id="page-cobros"    class="page"></section>
    <section id="page-ajustes"   class="page"></section>
  </main>

  <!-- ============ FAB ============ -->
  <button id="fab" class="fab" aria-label="Nuevo cliente">+</button>

  <!-- ============ BOTTOM NAVIGATION (estilo iOS) ============ -->
  <nav class="bottom-nav">
    <button id="tab-dashboard" data-tab="dashboard" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/>
      </svg>
      <span>Inicio</span>
    </button>

    <button id="tab-clientes" data-tab="clientes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="8" r="3.4"/><path d="M2.5 20c.6-3.6 3.3-5.6 6.5-5.6s5.9 2 6.5 5.6"/>
        <path d="M16.5 5.2a3.2 3.2 0 0 1 0 5.9"/><path d="M18 14.6c2.1.6 3.4 2.4 3.7 5.4"/>
      </svg>
      <span>Socios</span>
    </button>

    <button id="tab-escanear" data-tab="escanear" class="scan-btn">
      <span class="disc">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8"/><path d="M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8"/>
          <path d="M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16"/><path d="M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/>
          <path d="M4 12h16"/>
        </svg>
      </span>
      <span>Escanear</span>
    </button>

    <button id="tab-cobros" data-tab="cobros">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/>
        <path d="M6 15h4"/>
      </svg>
      <span>Cobros</span>
    </button>

    <button id="tab-ajustes" data-tab="ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.6 1.6 0 0 0 .32 1.77l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-1 1.47V21a2 2 0 1 1-4 0v-.11a1.6 1.6 0 0 0-1.05-1.47 1.6 1.6 0 0 0-1.77.32l-.06.06A2 2 0 1 1 4.4 16.9l.06-.06A1.6 1.6 0 0 0 4.78 15a1.6 1.6 0 0 0-1.47-1H3a2 2 0 1 1 0-4h.11A1.6 1.6 0 0 0 4.58 8.9a1.6 1.6 0 0 0-.32-1.77l-.06-.06A2 2 0 1 1 7.03 4.24l.06.06a1.6 1.6 0 0 0 1.77.32H9a1.6 1.6 0 0 0 1-1.47V3a2 2 0 1 1 4 0v.11a1.6 1.6 0 0 0 1 1.47 1.6 1.6 0 0 0 1.77-.32l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.6 1.6 0 0 0-.32 1.77V9a1.6 1.6 0 0 0 1.47 1H21a2 2 0 1 1 0 4h-.11a1.6 1.6 0 0 0-1.47 1z"/>
      </svg>
      <span>Ajustes</span>
    </button>
  </nav>

  <!-- ============ SHEET / MODAL / TOAST ============ -->
  <div id="sheet-backdrop" class="sheet-backdrop"></div>
  <div id="sheet" class="sheet">
    <div class="grab"></div>
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button id="sheet-close" class="btn icon" aria-label="Cerrar">x</button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>

  <div id="modal-backdrop" class="sheet-backdrop"></div>
  <div id="modal" class="modal">
    <div class="m-body" id="modal-body"></div>
    <div style="padding:0 18px 16px">
      <button id="modal-close" class="btn secondary">Cerrar</button>
    </div>
  </div>

  <div id="toast"></div>

  <!-- ============ LIBRERÍAS (locales → 100% offline) ============ -->
  <script src="./vendor/dexie.min.js"></script>
  <script src="./vendor/qrcode.js"></script>
  <script src="./vendor/html5-qrcode.min.js"></script>

  <!-- ============ APP ============ -->
  <script src="./js/db.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/qr.js"></script>
  <script src="./js/scanner.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
